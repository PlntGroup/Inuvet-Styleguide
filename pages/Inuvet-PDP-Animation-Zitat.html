<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDP-Animation mit Zitat – inuvet</title>
  <link rel="stylesheet" href="https://use.typekit.net/vhh5bbc.css">
  <link rel="stylesheet" href="../planet-brands.css?v=2">
  <link rel="stylesheet" href="../brand-inuvet.css?v=1">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
<symbol id="ui-format_quote" viewBox="0 0 24 24"><g fill="currentColor"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"/></g></symbol>
</svg>
<main id="MainContent">

  <!-- Mockup-Hinweis: Zitate sind Platzhalter, keine echten Aussagen -->
  <div class="container mt-1"><p class="section-label">Mockup · Produkt-Animation (PDP) · Zitate sind Platzhalter</p></div>

  <!-- A: heute -->
  <div class="container"><p class="label-caps">A · Heute: Produkttitel + Kurzbeschreibung</p></div>
  <div class="section-type --v1 --fit-text">
    <div class="section-type__animation">
      <lottie-player src="../assets/brands/inuvet/lotties/Inuvet_Respirax_Alena_Animation_Nagerkampagne_5x4_beschnitten.json" background="transparent" speed="1" loop autoplay></lottie-player>
    </div>
    <div class="section-type__content flow">
      <h2 class="section-type__headline">Respirax</h2>
      <div class="section-type__bottom flow">
        <p class="section-type__body">Unterstützt die Atemwege, fördert die Auswurffrequenz.</p>
      </div>
    </div>
  </div>

  <!-- B: Zitat groß, Name + Praxis -->
  <div class="container"><p class="label-caps">B · Zitat groß, Name + Praxis</p></div>
  <div class="section-type --v1 --fit-text">
    <div class="section-type__animation">
      <lottie-player src="../assets/brands/inuvet/lotties/Inuvet_Respirax_Alena_Animation_Nagerkampagne_5x4_beschnitten.json" background="transparent" speed="1" loop autoplay></lottie-player>
    </div>
    <div class="section-type__content flow">
      <figure class="testimonial --quote">
        <div class="testimonial__quote-mark" aria-hidden="true"><svg class="material-icons" viewBox="0 0 24 24" focusable="false"><use href="#ui-format_quote"></use></svg></div>
        <blockquote class="testimonial__text">[Platzhalter] Hier steht ein freigegebenes Zitat einer Tierarztpraxis zum Produkt – zwei bis drei Sätze, damit man die Wirkung beurteilen kann.</blockquote>
        <figcaption class="testimonial__author">
          <div>
            <p class="testimonial__name">Vorname Nachname</p>
            <p class="testimonial__role">Tierärztin · Praxisname, Ort</p>
          </div>
        </figcaption>
      </figure>
    </div>
  </div>

  <!-- C: Zitat groß mit Foto/Initial, getauscht -->
  <div class="container"><p class="label-caps">C · Zitat mit Foto (hier Initial), Bild und Text getauscht</p></div>
  <div class="section-type --v1 --fit-text --reverse">
    <div class="section-type__animation">
      <lottie-player src="../assets/brands/inuvet/lotties/Inuvet_Hepax-plus_Alena_Animation_Herosection_5x4_beschnitten.json" background="transparent" speed="1" loop autoplay></lottie-player>
    </div>
    <div class="section-type__content flow">
      <figure class="testimonial --quote">
        <div class="testimonial__quote-mark" aria-hidden="true"><svg class="material-icons" viewBox="0 0 24 24" focusable="false"><use href="#ui-format_quote"></use></svg></div>
        <blockquote class="testimonial__text">[Platzhalter] Ein kürzeres Zitat wirkt hier am stärksten.</blockquote>
        <figcaption class="testimonial__author">
          <div class="testimonial__avatar icon-box --initial" aria-hidden="true">V</div>
          <div>
            <p class="testimonial__name">Vorname Nachname</p>
            <p class="testimonial__role">Tierarzt · Praxisname, Ort</p>
          </div>
        </figcaption>
      </figure>
    </div>
  </div>

</main>
</body>
</html>
